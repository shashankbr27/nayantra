# =============================================================================
# config/nav2/carter_nav2.yaml — minimal Nav2 params for carter_v1 in Isaac Sim.
#
# Scope of THIS file:
#   * differential drive, base frame = base_link, odom topic = /odom
#   * NO localization (AMCL): map -> odom is a static identity transform, so the
#     robot navigates in the odom frame. Good for a sim demo; add AMCL + a real
#     map later for drift-free, multi-room nav.
#   * Obstacle avoidance: costmaps carry an obstacle layer fed by /scan (Isaac's
#     PhysX lidar — run isaac with LIDAR=1). With no /scan publisher the layer
#     stays empty (expected_update_rate 0.0 = never stale), so the no-lidar demo
#     behaves exactly as before. Planner is NavFn with A*: when the lidar marks
#     an obstacle on the current path, replanning routes around it — the "next
#     best path" emerges from the costmap, no path enumeration needed.
#   * Slow-down guardrail: RPP cost-regulated velocity scaling reduces speed as
#     the path passes near obstacles; the optional collision_monitor (launch with
#     COLLISION_MONITOR=1) adds hard slowdown/stop polygons straight off /scan.
#
# Frames must match Isaac: PublishOdometry uses odomFrameId=odom,
# chassisFrameId=base_link, so robot_base_frame=base_link everywhere here.
# Plugin names use Jazzy's "::" style.
# =============================================================================

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # Publish geometry_msgs/Twist (not TwistStamped) so Isaac's ROS2SubscribeTwist
    # on /cmd_vel actually receives it. Jazzy defaults to TwistStamped.
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Relaxed so an in-place turn-around (which doesn't translate) doesn't get
      # flagged as "no progress" and abort the goal (status=6).
      required_movement_radius: 0.25
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    # Regulated Pure Pursuit — robust for differential drive.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      # Safety guardrail: also scale speed down by costmap cost, so the robot
      # slows as its path passes near lidar-detected obstacles.
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0  # must match inflation_layer cost_scaling_factor
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.45
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          # 0.0 = never consider the source stale, so running WITHOUT the lidar
          # (LIDAR=0) leaves this layer empty instead of wedging the costmap.
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      robot_radius: 0.45
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.0  # tolerate a missing lidar (LIDAR=0 mode)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true  # A* over the costmap; obstacles re-cost cells, so the
      allow_unknown: true  # replanned route IS the "next best path" when blocked

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    # Recovery behaviors also drive /cmd_vel — keep them on plain Twist too.
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 2.0

# Optional hard safety guardrail (launch with COLLISION_MONITOR=1): sits between
# the controller and the robot (controller publishes cmd_vel_raw; this node
# publishes /cmd_vel), enforcing zones straight off /scan — no planner involved:
#   * PolygonSlow: anything inside -> velocity clamped to 30%
#   * PolygonStop: anything inside -> full stop until clear
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    enable_stamped_cmd_vel: false  # Isaac subscribes plain Twist
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "polygon"
      points: "[[0.6, 0.45], [0.6, -0.45], [-0.6, -0.45], [-0.6, 0.45]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
    PolygonSlow:
      type: "polygon"
      points: "[[1.2, 0.7], [1.2, -0.7], [-0.7, -0.7], [-0.7, 0.7]]"
      action_type: "slowdown"
      slowdown_ratio: 0.3
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      enabled: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 1.5]
    min_velocity: [-0.6, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1
