version: "3.9"

# =============================================================================
# Nayantra — Docker Compose stack
#
#   core        Nayantra Core: fleets, tasks, traffic, simulator, operator UI (8000)
#   mcp-server  MCP tool server — the LLM's only way to act (7000)
#   agent-api   LLM agent: natural language → MCP tools (8080)
#   prometheus / grafana  metrics
#
#   cp config/.env.example config/.env      # add an LLM API key
#   docker compose -f docker/docker-compose.yml up --build
#   open http://localhost:8000
#
# ROS 2 robots: run nayantra-core on a host with ROS 2 sourced (host networking
# for DDS) instead of this container, or add network_mode: host below.
# =============================================================================

services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: nayantra-core
    env_file: ../config/.env
    ports:
      - "8000:8000"
    environment:
      - CORE_HOST=0.0.0.0
      - AGENT_API_URL=http://agent-api:8080
      - MCP_SERVER_URL=http://mcp-server:7000
    volumes:
      - nayantra-data:/data
    restart: unless-stopped

  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    container_name: nayantra-mcp-server
    env_file: ../config/.env
    ports:
      - "7000:7000"
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=7000
      - NAYANTRA_CORE_URL=http://core:8000
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: nayantra-agent-api
    env_file: ../config/.env
    ports:
      - "8080:8080"
    environment:
      - AGENT_API_HOST=0.0.0.0
      - AGENT_API_PORT=8080
      - MCP_SERVER_URL=http://mcp-server:7000
      - NAYANTRA_CORE_URL=http://core:8000
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nayantra-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.2
    container_name: nayantra-grafana
    ports:
      - "3000:3000"
    # DEV ONLY — change the admin password before deploying anywhere non-local.
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  nayantra-data:
  grafana-data:
